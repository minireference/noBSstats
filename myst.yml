version: 1
project:
  title: No Bullshit Guide to Statistics
  authors:
    - name: Ivan Savov
  copyright: '2026'
  exclude:
    - venv
    - _build
    - Thumbs.db
    - .DS_Store
    - '**.ipynb_checkpoints'
    - README.md
    - data_generation
    - figures_generation
    - notebooks/explorations
    - notebooks/drafts
    - notebooks/cut_material
    - docs/
  static_files:
    - datasets
  github: minireference/noBSstats
  math:
    '\Mean': '\textbf{mean}'
    '\Var': '\textbf{var}'
    '\Std': '\textbf{std}'
    '\Freq': '\textbf{freq}'
    '\RelFreq': '\textbf{relfreq}'
    '\stderr': '\mathbf{se}_{#1}'
    '\stderrhat': '\hat{\mathbf{se}}_{#1}'
    '\CI': '\textbf{CI}_{#1}'
    '\CIL': '\textbf{L}_{#1}'
    '\CIU': '\textbf{U}_{#1}'
    '\ci': '\textbf{ci}_{#1}'
    '\cil': '\textbf{l}_{#1}'
    '\ciu': '\textbf{u}_{#1}'
    '\DMeans': '\textbf{dmeans}'
    '\Prop': '\textbf{prop}'
    '\DProps': '\textbf{dprops}'
    '\Err': ' {\Large \varepsilon}'
    '\calN': '\mathcal{N}'
    '\Tdist': '\mathcal{T}'
    '\Expon': '\mathrm{Expon}'
  thebe:
    binder:
      repo: minireference/noBSstats
      provider: github
      url: https://mybinder.org
      ref: main
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/noBSstats_notebooks.pdf
  toc:
    - file: intro.md
    - file: notebooks/README.md
      hidden: true
    - file: notebooks/10_DATA.md
      children:
        - file: notebooks/11_data_collection.ipynb
        - file: notebooks/12_data_in_practice.ipynb
        - file: notebooks/13_descriptive_statistics.ipynb
        - file: problems/ch1_data_problems.ipynb
    - file: notebooks/20_PROB.md
      children:
        - file: notebooks/21_discrete_random_vars.ipynb
        - file: notebooks/22_multiple_random_vars.ipynb
        - file: notebooks/23_inventory_discrete_dists.ipynb
        - file: notebooks/24_continuous_random_vars.ipynb
        - file: notebooks/25_multiple_continuous_random_vars.ipynb
        - file: notebooks/26_inventory_continuous_dists.ipynb
        - file: notebooks/27_simulations.ipynb
        - file: notebooks/28_random_samples.ipynb
    - file: notebooks/30_STATS.md
      children:
        - file: notebooks/31_estimators.ipynb
        - file: notebooks/32_confidence_intervals.ipynb
        - file: notebooks/33_intro_to_NHST.ipynb
        - file: notebooks/34_analytical_approx.ipynb
        - file: notebooks/35_comparing_two_populations.ipynb
        - file: notebooks/36_design.ipynb
        - file: notebooks/37_inventory_stats_tests.ipynb
        - file: examples/README.md
          children:
            - file: examples/statistical_design.ipynb
            - file: examples/one_sample_z-test.ipynb
            - file: examples/one_sample_t-test.ipynb
            - file: examples/two_sample_t-test.ipynb
            - file: examples/ANOVA.ipynb
            - file: examples/two_sample_equivalence_test.ipynb
    - file: notebooks/40_LINEAR_MODELS.md
      children:
        - file: notebooks/41_simple_linear_regression.ipynb
        - file: notebooks/42_multiple_linear_regression.ipynb
        - file: notebooks/43_interpreting_linear_models.ipynb
        - file: notebooks/44_regression_with_categorical_predictors.ipynb
        - file: notebooks/45_causal_inference.ipynb
        - file: notebooks/46_generalized_linear_models.ipynb
    - file: notebooks/50_BAYESIAN_STATS.md
      children:
        - file: notebooks/51_intro_to_Bayesian_stats.ipynb
        - file: notebooks/52_Bayesian_inference_computations.ipynb
        - file: notebooks/53_Bayesian_linear_models.ipynb
        - file: notebooks/54_difference_between_means.ipynb
        - file: notebooks/55_hierarchical_models.ipynb
    - file: tutorials/appendix.md
      children:
        - file: tutorials/python_tutorial.ipynb
        - file: tutorials/pandas_tutorial.ipynb
        - file: tutorials/seaborn_tutorial.ipynb
        - file: tutorials/calculus_tutorial.ipynb
    - file: reading_group/info.md
    - file: blogposts/index.md
      children:
        - file: blogposts/python_for_stats.ipynb
        - file: blogposts/probability_models.ipynb
        - file: blogposts/sampling_distributions.ipynb
        - file: blogposts/bootstrap.ipynb
        - file: blogposts/simulation_hypothesis_tests.ipynb
        - file: blogposts/permutation_test.ipynb
        - file: blogposts/stats_procedures.ipynb
        - file: blogposts/python_stats_libraries.ipynb
site:
  options:
    logo: logo.png
    folders: true
  template: book-theme
